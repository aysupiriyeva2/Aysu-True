<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aysu — Düzgün İzləmə </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #071525, #123b60);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.box {
    width: 90%;
    max-width: 390px;
    padding: 28px 22px;
    border-radius: 24px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #bdcada;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 16px 0 7px;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.25);
    color: white;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #168cff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#second {
    display: none;
    text-align: center;
}

.loader {
    width: 55px;
    height: 55px;
    margin: 25px auto;
    border: 5px solid rgba(255,255,255,0.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="box">

    <div id="first">

        <h1>AYSU</h1>

        <div class="subtitle">
            Düzgün izləmə — 
        </div>

        <label>Sizin nömrəniz</label>
        <input type="tel" placeholder="+994 XX XXX XX XX">

        <label>Qarşı tərəfin nömrəsi</label>
        <input type="tel" placeholder="+994 XX XXX XX XX">

        <label>Müddət</label>
        <select>
            <option>6 ay</option>
            <option>12 ay</option>
            <option>48 ay</option>
        </select>

        <button type="button" onclick="start()">
            START
        </button>

    </div>


    <div id="second">

        <h1>AYSU</h1>

        <div class="loader"></div>

        <p id="message">
            Sorğu başladılır...
        </p>

    </div>

</div>


<script>

function start() {

    document.getElementById("first").style.display = "none";

    document.getElementById("second").style.display = "block";

    setTimeout(function() {
        document.getElementById("message").innerHTML =
        "Məlumatlar yoxlanılır...";
    }, 1500);

    setTimeout(function() {
        document.getElementById("message").innerHTML =
        "Proses 1 saat sora bitəcək Aysu xanımməlumat verəcək.";
    }, 3500);

}

</script>

</body>
</html>
