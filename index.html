<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aysu — </title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(145deg,#071525,#12385a);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.box{
    width:90%;
    max-width:380px;
    padding:28px 22px;
    background:#ffffff14;
    border:1px solid #ffffff25;
    border-radius:24px;
}
h1{text-align:center;font-size:25px}
p{text-align:center;color:#bfcddd}
label{
    display:block;
    margin:18px 0 7px;
    font-size:14px;
}
input,select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #ffffff30;
    background:#00000030;
    color:white;
    box-sizing:border-box;
}
button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#168cff;
    color:white;
    font-size:17px;
    font-weight:bold;
}
#result{display:none;text-align:center}
.loader{
    width:50px;
    height:50px;
    border:4px solid #ffffff30;
    border-top:4px solid white;
    border-radius:50%;
    margin:25px auto;
    animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div class="box">

<div id="form">
<h1>AYSU</h1>
<p>Düzgün izləmə — </p>

<label>Sizin nömrəniz</label>
<input type="tel" placeholder="+994 XX XXX XX XX">

<label>Qarşı tərəfin nömrəsi</label>
<input type="tel" placeholder="+994 XX XXX XX XX">

<label>Müddət</label>
<select>
<option>1 dəqiqə</option>
<option>5 dəqiqə</option>
<option>10 dəqiqə</option>
<option>30 dəqiqə</option>
</select>

<button onclick="start()">START</button>
</div>

<div id="result">
<h1>AYSU</h1>
<div class="loader"></div>
<p id="status">Sorğu başladılır...</p>
</div>

</div>

<script>
function start(){
    document.getElementById("form").style.display="none";
    document.getElementById("result").style.display="block";

    setTimeout(()=>{
        document.getElementById("status").innerText=
        "Məlumatlar yoxlanılır...";
    },1500);

    setTimeout(()=>{
        document.getElementById("status").innerText=
        "
    },3500);
}
</script>

</body>
</html>
